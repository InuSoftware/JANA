# Publica GitHub Pages sem commitar supabase-config.js: URL e anon key vêm de Secrets.
#
# Requisitos no repositório GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       = https://xxxx.supabase.co
#     SUPABASE_ANON_KEY  = eyJhbGciOi... (chave anon do painel — nunca service_role)
#
# Settings → Pages → Build and deployment → Source: GitHub Actions
# (desative deploy direto por branch se estiver ativo.)

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# So um deploy por vez: push novo cancela workflow antigo ainda rodando (recomendacao GitHub Pages).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate supabase-config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          let url = (process.env.SUPABASE_URL || "").trim();
          while (url.endsWith("/")) url = url.slice(0, -1);
          if (/\/rest\/v1$/i.test(url)) url = url.replace(/\/rest\/v1$/i, "");
          while (url.endsWith("/")) url = url.slice(0, -1);
          const key = (process.env.SUPABASE_ANON_KEY || "").trim();
          if (!url || !key) {
            console.error("Defina os secrets SUPABASE_URL e SUPABASE_ANON_KEY em Settings → Secrets → Actions.");
            process.exit(1);
          }
          const body =
            "/** Gerado no CI. Nao commitar credenciais no repositorio. */\n" +
            `window.__SUPABASE_URL__ = ${JSON.stringify(url)};\n` +
            `window.__SUPABASE_ANON_KEY__ = ${JSON.stringify(key)};\n`;
          fs.writeFileSync("supabase-config.js", body);
          NODE

      - name: Assemble site (arquivos estaticos do app)
        run: |
          mkdir -p _site
          cp index.html app.js supabase-config.js _site/
          if [ -d image ]; then cp -r image _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # O passo de deploy pode terminar no CI antes do Pages liberar o slot; retry evita 400 em push seguido.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait for Pages slot
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
